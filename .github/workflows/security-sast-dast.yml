name: SAST and DAST Security Scan

on:
  workflow_dispatch:
  push:
    branches:
      - dev
      - staging

permissions:
  contents: read
  security-events: write
  actions: read
  packages: write

env:
  IMAGE_NAME: nodejs-sast-dast-demo

jobs:
  sast-codeql:
    name: SAST - CodeQL
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Init CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript

      - name: Analyze with CodeQL
        uses: github/codeql-action/analyze@v4

  build-and-push-image:
    name: Build and Push Docker Image to GHCR
    runs-on: ubuntu-latest
    needs: sast-codeql

    outputs:
      image_tag: ${{ steps.image_vars.outputs.image_tag }}
      image_full_name: ${{ steps.image_vars.outputs.image_full_name }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Prepare image variables
        id: image_vars
        run: |
          OWNER_LOWER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          BRANCH_NAME="${{ github.ref_name }}"
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)

          IMAGE_TAG="${BRANCH_NAME}-${SHORT_SHA}"
          IMAGE_FULL_NAME="ghcr.io/${OWNER_LOWER}/${{ env.IMAGE_NAME }}:${IMAGE_TAG}"

          echo "image_tag=${IMAGE_TAG}" >> "$GITHUB_OUTPUT"
          echo "image_full_name=${IMAGE_FULL_NAME}" >> "$GITHUB_OUTPUT"

          echo "Image will be pushed as:"
          echo "${IMAGE_FULL_NAME}"

      - name: Login to GHCR
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io \
            -u "${{ github.actor }}" \
            --password-stdin

      - name: Build Docker image
        run: |
          docker build \
            -t "${{ steps.image_vars.outputs.image_full_name }}" \
            .

      - name: Push Docker image to GHCR
        run: |
          docker push "${{ steps.image_vars.outputs.image_full_name }}"

  dast-dev:
    name: DAST - OWASP ZAP Baseline - DEV
    runs-on: ubuntu-latest
    needs: build-and-push-image
    if: github.ref_name == 'dev'

    steps:
      - name: Validate DEV target URL
        run: |
          if [ -z "${{ vars.DEV_APP_URL }}" ]; then
            echo "Missing GitHub variable: DEV_APP_URL"
            exit 1
          fi

          echo "Scanning DEV URL: ${{ vars.DEV_APP_URL }}"
          echo "Image built and pushed: ${{ needs.build-and-push-image.outputs.image_full_name }}"

      - name: Run ZAP Baseline Scan for DEV
        run: |
          set +e

          docker run --rm \
            --user root \
            -v "$PWD:/zap/wrk:rw" \
            -w /zap/wrk \
            ghcr.io/zaproxy/zaproxy:stable zap-baseline.py \
            -t "${{ vars.DEV_APP_URL }}" \
            -r "zap-dev-report.html" \
            -J "zap-dev-report.json"

          ZAP_EXIT_CODE=$?

          echo "$ZAP_EXIT_CODE" > zap-dev-exit-code.txt

          echo "ZAP finished with exit code: $ZAP_EXIT_CODE"
          echo "Files after ZAP scan:"
          ls -la

          exit 0

      - name: Upload DEV DAST Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dast-zap-dev-report
          path: |
            zap-dev-report.html
            zap-dev-report.json
            zap-dev-exit-code.txt
          if-no-files-found: warn

      - name: DEV Security Gate Decision
        if: always()
        run: |
          SECURITY_GATE_MODE="${{ vars.SECURITY_GATE_MODE }}"
          ZAP_BLOCK_LEVEL="${{ vars.ZAP_BLOCK_LEVEL }}"

          if [ -z "$SECURITY_GATE_MODE" ]; then
            SECURITY_GATE_MODE="report-only"
          fi

          if [ -z "$ZAP_BLOCK_LEVEL" ]; then
            ZAP_BLOCK_LEVEL="fail"
          fi

          if [ ! -f zap-dev-exit-code.txt ]; then
            echo "ZAP exit code file was not found. Failing because scan result is unknown."
            exit 1
          fi

          ZAP_EXIT_CODE=$(cat zap-dev-exit-code.txt)

          echo "Security gate mode: $SECURITY_GATE_MODE"
          echo "ZAP block level: $ZAP_BLOCK_LEVEL"
          echo "ZAP exit code: $ZAP_EXIT_CODE"

          if [ "$SECURITY_GATE_MODE" = "report-only" ]; then
            echo "Report-only mode: reports were uploaded and pipeline will continue."
            exit 0
          fi

          if [ "$SECURITY_GATE_MODE" = "enforce" ]; then
            if [ "$ZAP_EXIT_CODE" -eq 1 ]; then
              echo "Enforce mode: ZAP found FAIL-level alerts. Failing pipeline."
              exit 1
            fi

            if [ "$ZAP_EXIT_CODE" -eq 2 ]; then
              if [ "$ZAP_BLOCK_LEVEL" = "warn" ]; then
                echo "Enforce mode with block level WARN: ZAP found WARN-level alerts. Failing pipeline."
                exit 1
              else
                echo "Enforce mode with block level FAIL: ZAP found WARN-level alerts only. Not blocking."
                exit 0
              fi
            fi

            if [ "$ZAP_EXIT_CODE" -eq 3 ]; then
              echo "Enforce mode: ZAP had an operational error. Failing pipeline."
              exit 1
            fi

            echo "Enforce mode: no blocking ZAP result."
            exit 0
          fi

          echo "Invalid SECURITY_GATE_MODE value. Use 'report-only' or 'enforce'."
          exit 1

  dast-staging:
    name: DAST - OWASP ZAP Baseline - STAGING
    runs-on: ubuntu-latest
    needs: build-and-push-image
    if: github.ref_name == 'staging'

    steps:
      - name: Validate STG target URL
        run: |
          if [ -z "${{ vars.STG_APP_URL }}" ]; then
            echo "Missing GitHub variable: STG_APP_URL"
            exit 1
          fi

          echo "Scanning STG URL: ${{ vars.STG_APP_URL }}"
          echo "Image built and pushed: ${{ needs.build-and-push-image.outputs.image_full_name }}"

      - name: Run ZAP Baseline Scan for STAGING
        run: |
          set +e

          docker run --rm \
            --user root \
            -v "$PWD:/zap/wrk:rw" \
            -w /zap/wrk \
            ghcr.io/zaproxy/zaproxy:stable zap-baseline.py \
            -t "${{ vars.STG_APP_URL }}" \
            -r "zap-stg-report.html" \
            -J "zap-stg-report.json"

          ZAP_EXIT_CODE=$?

          echo "$ZAP_EXIT_CODE" > zap-stg-exit-code.txt

          echo "ZAP finished with exit code: $ZAP_EXIT_CODE"
          echo "Files after ZAP scan:"
          ls -la

          exit 0

      - name: Upload STG DAST Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dast-zap-stg-report
          path: |
            zap-stg-report.html
            zap-stg-report.json
            zap-stg-exit-code.txt
          if-no-files-found: warn

      - name: STG Security Gate Decision
        if: always()
        run: |
          SECURITY_GATE_MODE="${{ vars.SECURITY_GATE_MODE }}"
          ZAP_BLOCK_LEVEL="${{ vars.ZAP_BLOCK_LEVEL }}"

          if [ -z "$SECURITY_GATE_MODE" ]; then
            SECURITY_GATE_MODE="report-only"
          fi

          if [ -z "$ZAP_BLOCK_LEVEL" ]; then
            ZAP_BLOCK_LEVEL="fail"
          fi

          if [ ! -f zap-stg-exit-code.txt ]; then
            echo "ZAP exit code file was not found. Failing because scan result is unknown."
            exit 1
          fi

          ZAP_EXIT_CODE=$(cat zap-stg-exit-code.txt)

          echo "Security gate mode: $SECURITY_GATE_MODE"
          echo "ZAP block level: $ZAP_BLOCK_LEVEL"
          echo "ZAP exit code: $ZAP_EXIT_CODE"

          if [ "$SECURITY_GATE_MODE" = "report-only" ]; then
            echo "Report-only mode: reports were uploaded and pipeline will continue."
            exit 0
          fi

          if [ "$SECURITY_GATE_MODE" = "enforce" ]; then
            if [ "$ZAP_EXIT_CODE" -eq 1 ]; then
              echo "Enforce mode: ZAP found FAIL-level alerts. Failing pipeline."
              exit 1
            fi

            if [ "$ZAP_EXIT_CODE" -eq 2 ]; then
              if [ "$ZAP_BLOCK_LEVEL" = "warn" ]; then
                echo "Enforce mode with block level WARN: ZAP found WARN-level alerts. Failing pipeline."
                exit 1
              else
                echo "Enforce mode with block level FAIL: ZAP found WARN-level alerts only. Not blocking."
                exit 0
              fi
            fi

            if [ "$ZAP_EXIT_CODE" -eq 3 ]; then
              echo "Enforce mode: ZAP had an operational error. Failing pipeline."
              exit 1
            fi

            echo "Enforce mode: no blocking ZAP result."
            exit 0
          fi

          echo "Invalid SECURITY_GATE_MODE value. Use 'report-only' or 'enforce'."
          exit 1