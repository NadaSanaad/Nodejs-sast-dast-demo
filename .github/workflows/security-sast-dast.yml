name: SAST and DAST Security Scan

on:
  workflow_dispatch:
  push:
    branches:
      - dev
      - staging

permissions:
  contents: read
  security-events: write
  actions: read
  packages: write

env:
  IMAGE_NAME: nodejs-sast-dast-demo

jobs:
  sast-codeql:
    name: SAST - CodeQL
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Init CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript

      - name: Analyze with CodeQL
        uses: github/codeql-action/analyze@v4

  build-and-push-image:
    name: Build and Push Docker Image to GHCR
    runs-on: ubuntu-latest
    needs: sast-codeql

    outputs:
      image_tag: ${{ steps.image_vars.outputs.image_tag }}
      image_full_name: ${{ steps.image_vars.outputs.image_full_name }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Prepare image variables
        id: image_vars
        run: |
          OWNER_LOWER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          BRANCH_NAME="${{ github.ref_name }}"
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)

          IMAGE_TAG="${BRANCH_NAME}-${SHORT_SHA}"
          IMAGE_FULL_NAME="ghcr.io/${OWNER_LOWER}/${{ env.IMAGE_NAME }}:${IMAGE_TAG}"

          echo "image_tag=${IMAGE_TAG}" >> "$GITHUB_OUTPUT"
          echo "image_full_name=${IMAGE_FULL_NAME}" >> "$GITHUB_OUTPUT"

          echo "Image will be pushed as:"
          echo "${IMAGE_FULL_NAME}"

      - name: Login to GHCR
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io \
            -u "${{ github.actor }}" \
            --password-stdin

      - name: Build Docker image
        run: |
          docker build \
            -t "${{ steps.image_vars.outputs.image_full_name }}" \
            .

      - name: Push Docker image to GHCR
        run: |
          docker push "${{ steps.image_vars.outputs.image_full_name }}"

  dast-dev:
    name: DAST - OWASP ZAP Baseline - DEV
    runs-on: ubuntu-latest
    needs: build-and-push-image
    if: github.ref_name == 'dev'

    steps:
      - name: Validate DEV target URL
        run: |
          if [ -z "${{ vars.DEV_APP_URL }}" ]; then
            echo "Missing GitHub variable: DEV_APP_URL"
            exit 1
          fi
          echo "Scanning DEV URL: ${{ vars.DEV_APP_URL }}"
          echo "Image built and pushed: ${{ needs.build-and-push-image.outputs.image_full_name }}"

      - name: Run ZAP Baseline Scan for DEV
        run: |
          set +e

          docker run --rm \
            --user root \
            -v "$PWD:/zap/wrk:rw" \
            -w /zap/wrk \
            ghcr.io/zaproxy/zaproxy:stable zap-baseline.py \
            -t "${{ vars.DEV_APP_URL }}" \
            -r "zap-dev-report.html" \
            -J "zap-dev-report.json"

          ZAP_EXIT_CODE=$?

          echo "ZAP finished with exit code: $ZAP_EXIT_CODE"
          echo "Files after ZAP scan:"
          ls -la

          exit 0

      - name: Upload DEV DAST Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dast-zap-dev-report
          path: |
            zap-dev-report.html
            zap-dev-report.json
          if-no-files-found: warn

  dast-staging:
    name: DAST - OWASP ZAP Baseline - STAGING
    runs-on: ubuntu-latest
    needs: build-and-push-image
    if: github.ref_name == 'staging'

    steps:
      - name: Validate STG target URL
        run: |
          if [ -z "${{ vars.STG_APP_URL }}" ]; then
            echo "Missing GitHub variable: STG_APP_URL"
            exit 1
          fi
          echo "Scanning STG URL: ${{ vars.STG_APP_URL }}"
          echo "Image built and pushed: ${{ needs.build-and-push-image.outputs.image_full_name }}"

      - name: Run ZAP Baseline Scan for STAGING
        run: |
          set +e

          docker run --rm \
            --user root \
            -v "$PWD:/zap/wrk:rw" \
            -w /zap/wrk \
            ghcr.io/zaproxy/zaproxy:stable zap-baseline.py \
            -t "${{ vars.STG_APP_URL }}" \
            -r "zap-stg-report.html" \
            -J "zap-stg-report.json"

          ZAP_EXIT_CODE=$?

          echo "ZAP finished with exit code: $ZAP_EXIT_CODE"
          echo "Files after ZAP scan:"
          ls -la

          exit 0

      - name: Upload STG DAST Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dast-zap-stg-report
          path: |
            zap-stg-report.html
            zap-stg-report.json
          if-no-files-found: warn